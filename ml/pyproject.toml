[project]
name = "tabien-ml"
version = "0.0.0"
description = "Taller de ML de Tabien: entrenamiento, evaluación y exportación (nunca corre en el dispositivo)"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
